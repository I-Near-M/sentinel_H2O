# -------------------------------------------------------------------------
# 1. SUBDOMINIO GRAFANA (ej. grafana.tudominio.com)
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ~^grafana\..*$;

    location = /_auth_proxy_verify {
        internal;
        proxy_pass http://sentinel-backend:8000/api/v1/auth/auth-proxy-verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/user/auth-tokens/rotate {
        default_type application/json;
        return 200 '{"message":"Auth proxy token active"}';
    }

    location / {
        auth_request /_auth_proxy_verify;
        auth_request_set $auth_user $upstream_http_x_webauth_user;
        auth_request_set $auth_name $upstream_http_x_webauth_name;
        auth_request_set $auth_email $upstream_http_x_webauth_email;
        auth_request_set $auth_role $upstream_http_x_webauth_role;

        proxy_pass http://sentinel-grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-NAME $auth_name;
        proxy_set_header X-WEBAUTH-EMAIL $auth_email;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;
    }
}

# -------------------------------------------------------------------------
# 2. SUBDOMINIO API BACKEND & DOCS (ej. api.tudominio.com)
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ~^api\..*$;

    location / {
        proxy_pass http://sentinel-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}

# -------------------------------------------------------------------------
# 3. WEB APP PRINCIPAL / DEFAULT (ej. sentinel.tudominio.com, localhost, etc.)
# -------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Reverse proxy para API Backend
    location ^~ /api/ {
        proxy_pass http://sentinel-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Subconsulta interna para validar sesión Auth Proxy con Grafana
    location = /_auth_proxy_verify {
        internal;
        proxy_pass http://sentinel-backend:8000/api/v1/auth/auth-proxy-verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirección de /grafana a /grafana/
    location = /grafana {
        return 301 /grafana/;
    }

    # Interceptar rotación de tokens de sesión para Auth Proxy
    location = /grafana/api/user/auth-tokens/rotate {
        default_type application/json;
        return 200 '{"message":"Auth proxy token active"}';
    }

    # Reverse proxy para Grafana con Auth Proxy SSO
    location ^~ /grafana/ {
        auth_request /_auth_proxy_verify;
        auth_request_set $auth_user $upstream_http_x_webauth_user;
        auth_request_set $auth_name $upstream_http_x_webauth_name;
        auth_request_set $auth_email $upstream_http_x_webauth_email;
        auth_request_set $auth_role $upstream_http_x_webauth_role;

        proxy_pass http://sentinel-grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-NAME $auth_name;
        proxy_set_header X-WEBAUTH-EMAIL $auth_email;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;
    }

    # Reverse proxy para Docs OpenAPI / Swagger
    location ^~ /docs {
        proxy_pass http://sentinel-backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /openapi.json {
        proxy_pass http://sentinel-backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Enrutamiento Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
