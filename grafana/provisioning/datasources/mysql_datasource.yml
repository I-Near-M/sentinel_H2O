apiVersion: 1

datasources:
  - name: Sentinel-MySQL
    type: mysql
    access: proxy
    url: sentinel-db:3306
    database: ${MYSQL_DATABASE}
    user: ${MYSQL_USER}
    secureJsonData:
      password: ${MYSQL_PASSWORD}
    isDefault: true
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false

