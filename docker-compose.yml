services:
  # -------------------------------------------------------------------------
  # 1. BASE DE DATOS MYSQL 8.0 (Persistente + Schema 3.0)
  # -------------------------------------------------------------------------
  sentinel-db:
    image: mysql:8.0
    container_name: sentinel_mysql
    restart: always
    environment:
      TZ: "${TZ:-America/Lima}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-sentinel_root_secret_2026}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-sentinel_h2o_db}"
      MYSQL_USER: "${MYSQL_USER:-sentinel_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-sentinel_db_password_2026}"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-sentinel_root_secret_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sentinel_net

  # -------------------------------------------------------------------------
  # 2. BACKEND API FASTAPI + MOTOR IA + STREAMING
  # -------------------------------------------------------------------------
  sentinel-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_api
    restart: always
    depends_on:
      sentinel-db:
        condition: service_healthy
    environment:
      TZ: "${TZ:-America/Lima}"
      PROJECT_NAME: "${PROJECT_NAME:-Sentinel-H2O Backend API}"
      VERSION: "${VERSION:-2.0.0}"
      ENV: "${ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-sentinel_user}:${MYSQL_PASSWORD:-sentinel_db_password_2026}@sentinel-db:3306/${MYSQL_DATABASE:-sentinel_h2o_db}}"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY:-}"
      WHATSAPP_PROVIDER: "${WHATSAPP_PROVIDER:-mock}"
      WHATSAPP_API_TOKEN: "${WHATSAPP_API_TOKEN:-}"
      MASTER_API_KEY: "${MASTER_API_KEY:-sentinel_master_key_chancay_2026_secure}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-sentinel_production_jwt_secret_key_2026_secure_32bytes}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-[\"*\"]}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
    networks:
      - sentinel_net

  # -------------------------------------------------------------------------
  # 3. FRONTEND WEB APP (React + Three.js + Bun Multi-stage + Nginx Gateway)
  # -------------------------------------------------------------------------
  sentinel-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_webapp
    restart: always
    depends_on:
      - sentinel-backend
    environment:
      - TZ=${TZ:-America/Lima}
      - VITE_API_URL=${VITE_API_URL:-/api/v1}
    ports:
      - "${WEBAPP_PORT:-80}:80"
    networks:
      - sentinel_net

volumes:
  mysql_data:
    driver: local

networks:
  sentinel_net:
    driver: bridge
